<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Garages</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <!-- Garage menu -->
    <div id="garage" class="garage" hidden>
        <div class="g-shell" role="dialog" aria-labelledby="g-name">
            <aside class="g-side">
                <header class="g-head">
                    <div id="g-icon" class="g-icon"></div>
                    <div class="g-title">
                        <h1 id="g-name"></h1>
                        <p id="g-sub"></p>
                    </div>
                </header>

                <label class="search">
                    <span id="g-search-icon"></span>
                    <input id="g-q" type="text" placeholder="Search model or plate" autocomplete="off" spellcheck="false">
                    <kbd>/</kbd>
                </label>

                <nav id="g-tabs" class="tabs" aria-label="Filter"></nav>
                <div id="g-list" class="v-list" role="listbox"></div>
            </aside>

            <main class="g-main">
                <div class="g-top">
                    <div id="g-money" class="g-money"></div>
                    <button id="g-close" class="icon-btn" type="button" aria-label="Close" title="Close (Esc)"></button>
                </div>
                <section id="g-detail" class="detail" aria-live="polite"></section>
            </main>

            <div id="g-modal" class="modal-root"></div>
        </div>
    </div>

    <!-- Creator / manager (admins) -->
    <div id="admin" class="admin" hidden>
        <div class="a-panel">
            <header class="a-head">
                <button id="a-back" class="icon-btn" type="button" aria-label="Back" title="Back" hidden></button>
                <div class="a-title">
                    <p id="a-eyebrow" class="eyebrow"></p>
                    <h1 id="a-heading"></h1>
                </div>
                <button id="a-close" class="icon-btn" type="button" aria-label="Close" title="Close (Esc)"></button>
            </header>
            <div id="a-body" class="a-body"></div>
            <footer id="a-foot" class="a-foot"></footer>
        </div>
    </div>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <script src="js/common.js"></script>
    <script src="js/garage.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
